[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cefito"
version = "1.0.0"
description = "Contrastive Energy Fields for Inference-Time Procedure Planning in Instructional Videos"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mohamed Afham", email = "afham.aflal@visinf.tu-darmstadt.de" },
]

dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Weights & Biases logging (enabled with `--wandb`).
logging = ["wandb>=0.16"]
# CLIP text encoder for scripts/extract_action_embeddings.py.
embeddings = ["open_clip_torch>=2.23"]

[project.urls]
Homepage = "https://visinf.github.io/cefito"

[tool.hatch.build.targets.wheel]
packages = ["src/cefito"]
