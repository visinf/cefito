# CEFITO on CrossTask, planning horizon T=4 (Tab. 1, right).
dataset: crosstask
horizon: 4
num_actions: 133
num_tasks: 18
run_name: crosstask_t4

model:
  observation_dim: 1536
  hidden_dim: 384
  depth: 4
  num_heads: 6
  mlp_ratio: 4.0
  causal_attention: true

loss:
  num_negatives: 50
  hard_negative_ratio: 0.8
  min_margin: 0.01
  max_margin: 0.1
  aux_weight: 0.5

train:
  epochs: 200
  batch_size: 256
  lr: 8.0e-5
  weight_decay: 1.0e-3
  ema_decay: 0.995
  step_start_ema: 400
  update_ema_every: 10
  eval_every: 3
  num_workers: 0
  seed: 25

eval:
  batch_size: 8
  chunk_size: 50000
  oracle_task: false
